[package]
name = "queryx-desktop"
version = "0.1.0"
description = "QueryX local-first database IDE"
authors = ["UULab"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/uulab-official/queryx"

[lib]
name = "queryx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
async-trait = "0.1.91"
base64 = "0.22.1"
bigdecimal = "0.4.9"
chrono = "0.4.45"
futures-util = "0.3.31"
keyring = "4.1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "postgres", "mysql", "json", "chrono", "uuid", "bigdecimal"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
