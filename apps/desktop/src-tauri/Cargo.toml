[package]
name = "queryx-desktop"
version = "0.1.0"
description = "QueryX local-first database IDE"
authors = ["UULab"]
edition = "2021"

[lib]
name = "queryx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
async-trait = "0.1.91"
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
